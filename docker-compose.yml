version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: truthguard-postgres
    environment:
      POSTGRES_USER: truthguard
      POSTGRES_PASSWORD: truthguard_password
      POSTGRES_DB: truthguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truthguard -d truthguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: truthguard-backend
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql://truthguard:truthguard_password@postgres:5432/truthguard
      - MOCK_MODE=true
      - REQUEST_TIMEOUT_SECONDS=5.0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: truthguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
